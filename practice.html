<section>
<h2>اليوم 1: المنهجية ومعايير القبول</h2>
<ol>
<li><p>في مكتبة الجامعة أربعة فروع. سجل الإعارة الإلكتروني مطبق في ثلاثة منها، والرابع ما زال يعمل بالدفاتر. المواصفة تطلب السجل في الجهة كلها. ما القيمة في ورقة الامتثال؟</p><ul><li><b>أ.</b> 75%، ثلاثة فروع من أربعة</li><li><b>ب.</b> 0%، مع ملاحظة عن الفرع الرابع</li><li><b>ج.</b> 100%، والفرع الرابع تفصيل</li><li><b>د.</b> لا ينطبق حتى يكتمل التطبيق</li></ul></li>
<li><p>اعتمدت عمادة الدراسات العليا الإصدار 3 من دليل البيانات البحثية، وقرار الاعتماد يلغي الإصدار 2. ما زال الإصدار 2 منشورًا في البوابة الداخلية. ما حكمه في الجرد؟</p><ul><li><b>أ.</b> ينطبق، لأنه منشور</li><li><b>ب.</b> غير ملزم، لأنه مرجع قديم للعمادة</li><li><b>ج.</b> ينطبق مع الإصدار 3 حتى يُحذف من البوابة</li><li><b>د.</b> لا ينطبق، والسبب قرار الإلغاء</li></ul></li>
<li><p>مواصفة إدارة الإصدارات (DG.8.3) تطلب أن تعرّف الجهة إدارة إصدارات لوثائق إدارة البيانات وتطبقها. أي دليل يثبت طبقة التطبيق في مكتبة الجامعة؟</p><ul><li><b>أ.</b> إجراء إدارة الإصدارات المعتمد من عميد شؤون المكتبات</li><li><b>ب.</b> بريد من مدير الأنظمة يؤكد أن الإصدارات تُدار في كل الوثائق</li><li><b>ج.</b> مستخرج من مكتبة الوثائق بإصدارات وتواريخ داخل الفترة</li><li><b>د.</b> شريحة من دورة تدريبية عن الإصدارات قُدمت للموظفين</li></ul></li>
<li><p>كتب زميل لمواصفة المراجعة الدورية للخطة (DG.6.1) في خانة «ما يثبت أنه مطبق»: «مراجعات مناسبة للخطة بحسب الحاجة». ما العيب الأول؟</p><ul><li><b>أ.</b> D1 فعل غامض لا يُعدّ</li><li><b>ب.</b> D2 المعتمِد خطأ، لأن الخانة لا تذكر من يعتمد المراجعات</li><li><b>ج.</b> D4 أكثر مما تطلبه المواصفة من المراجعات</li><li><b>د.</b> D3 الوثيقة دليل على نفسها</li></ul></li>
<li><p>سكن الطلاب في الجامعة يطبق إجراء تحديث بيانات الساكنين في خمسة مبانٍ من ستة. المواصفة تطلب الإجراء في الجهة كلها. ما قيمتها في ورقة الامتثال؟</p><ul><li><b>أ.</b> 83%، خمسة مبانٍ من ستة</li><li><b>ب.</b> 0%، والمبنى السادس يدخل سجل الملاحظات</li><li><b>ج.</b> 100%، لأن الأغلبية تكفي في التقييم الذاتي</li><li><b>د.</b> تُترك فارغة حتى يُطبق الإجراء في المبنى السادس</li></ul></li>
<li><p>في ضابط واحد لعمادة الدراسات العليا ثلاث مواصفات نتائجها 100 و0 و100، وفي ضابط ثانٍ من المجال نفسه مواصفة واحدة نتيجتها 0. بافتراض المقرر في الرفع (متوسط المواصفات ثم متوسط الضوابط)، ما درجة المجال؟</p><ul><li><b>أ.</b> 50%، متوسط المواصفات الأربع مباشرة</li><li><b>ب.</b> 66.7%، درجة الضابط الأول وحده</li><li><b>ج.</b> 0%، لأن في المجال مواصفة غير ممتثلة</li><li><b>د.</b> 33.3%، متوسط الضابطين</li></ul></li>
<li><p>في جرد مكتبة الجامعة: «دليل إدارة بيانات المكتبات الذي نشرته جامعة أخرى على موقعها، وتستأنس به المكتبة». أي حكم يصح له في جرد ملف الامتثال؟</p><ul><li><b>أ.</b> غير ملزم، ويبقى في الجرد مرجعًا للمكتبة</li><li><b>ب.</b> ينطبق، لأنه منشور ومتاح لكل الجهات</li><li><b>ج.</b> لا ينطبق، لأن المكتبة لا تتبع تلك الجامعة</li><li><b>د.</b> ينطبق ويُقيَّم عبر الجامعة التي أصدرته</li></ul></li>
<li><p>سجلت عمادة الدراسات العليا مواصفة «سجل القرارات» 100% في التقرير السنوي، وعمود الدليل فارغ. ما الخطر الذي يجعل هذه الخانة مشكلة حتى بعد التقديم؟</p><ul><li><b>أ.</b> أن نظام التقديم يرفض التقرير فور رفعه لأن أحد أعمدته فارغ</li><li><b>ب.</b> أن الدرجة تُحسب 50% تلقائيًا لغياب الدليل</li><li><b>ج.</b> أن المكتب الوطني قد يدقق الجهة ويطلب دليل كل مواصفة</li><li><b>د.</b> أن الدليل يُطلب في الدورة القادمة وحدها</li></ul></li>
<li><p>مواصفة في المكتبة تطلب أن «تراقب الجهة جودة بيانات الإعارة بانتظام». أي صياغة لخانة «ما يثبت أنه مطبق» أصح؟</p><ul><li><b>أ.</b> إجراء مراقبة جودة بيانات الإعارة المعتمد</li><li><b>ب.</b> تشغيل القواعد يوميًا طوال السنة دون انقطاع، بتاريخ كل تشغيل</li><li><b>ج.</b> سجل تشغيل القواعد بتواريخ تغطي فترة الأدلة كلها</li><li><b>د.</b> مراقبة مناسبة لجودة البيانات</li></ul></li>
<li><p>كتب زميل لمواصفة «تعيّن الجهة مسؤولًا للبيانات المفتوحة ويُكتب دوره في وصف وظيفي»: «ما يثبت أنه مطبق: تقارير شهرية من المسؤول عن البيانات المفتوحة». ما العيب؟</p><ul><li><b>أ.</b> D4 يطلب أكثر مما تطلبه المواصفة</li><li><b>ب.</b> D1 فعل غامض</li><li><b>ج.</b> D5 بلا نافذة زمنية</li><li><b>د.</b> D6 أقل مما تطلبه المواصفة</li></ul></li>
<li><p>جدول الاعتماد في الجامعة يجعل سياسة الاحتفاظ بسجلات سكن الطلاب لعميد شؤون الطلاب. وصلت نسخة اعتمدها وكيل الجامعة، وهو أعلى رتبة. ما الحكم على طبقة الاعتماد؟</p><ul><li><b>أ.</b> كافية، لأن وكيل الجامعة يملك صلاحيات العمداء في الهيكل التنظيمي</li><li><b>ب.</b> كافية إذا وقّع العميد بعدها في أي وقت</li><li><b>ج.</b> جزئية، لأن الاعتماد موجود من دور آخر</li><li><b>د.</b> غير كافية، لأن المعتمِد غير الدور المحدد في الجدول</li></ul></li>
<li><p>ميثاق لجنة البيانات البحثية في عمادة الدراسات العليا اعتُمد قبل ثلاث سنوات وما زال نافذًا، ومحضر آخر اجتماع للجنة من السنة قبل الماضية. أيهما يصلح دليلًا في هذه الدورة؟</p><ul><li><b>أ.</b> كلاهما، لأنهما معتمدان وموقعان</li><li><b>ب.</b> الميثاق وحده؛ المحضر خارج فترة الأدلة</li><li><b>ج.</b> المحضر وحده؛ الميثاق أقدم من فترة الأدلة</li><li><b>د.</b> لا أحدهما، لأن كليهما أقدم من فترة الأدلة</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الأدلة والدرجات</h2>
<ol>
<li><p>مواصفة في المكتبة: «يُعيَّن أمين بيانات لكل نظام من أنظمة المكتبة الثلاثة، ويُعتمد تعيينه». معيار القبول المكتوب لها: «قرار تعيين أمين بيانات نظام الإعارة». أي عيب فيه؟</p><ul><li><b>أ.</b> D1 فعل غامض لا يُرى ولا يُعدّ</li><li><b>ب.</b> D4 أكثر مما تطلبه المواصفة</li><li><b>ج.</b> D6 أقل مما تطلبه المواصفة</li><li><b>د.</b> D5 بلا نافذة زمنية يقع فيها القرار</li></ul></li>
<li><p>بند في ملف عمادة الدراسات العليا: محضر اجتماع للجنة البيانات البحثية، غير موقع من رئيس الاجتماع، وتاريخه قبل بداية الفترة بشهرين، قُدِّم لطبقة التطبيق. أي حكم ورمز؟</p><ul><li><b>أ.</b> غير كاف بالقاعدة R1: وثيقة تشغيل قبل الفترة</li><li><b>ب.</b> غير كاف بالقاعدة R2: محضر بلا توقيع رئيس الاجتماع</li><li><b>ج.</b> غير كاف بالقاعدتين R1 وR2 معًا</li><li><b>د.</b> جزئي بالقاعدة R4: يغطي جزءًا من الفترة</li></ul></li>
<li><p>مواصفة في المكتبة تطلب معاييرها ثلاث طبقات: الوجود والاعتماد والتطبيق. البنود: وثيقة كافية للوجود، وقرار كاف للاعتماد، وسجل تشغيل جزئي (R4) للتطبيق. ما امتثال المواصفة؟</p><ul><li><b>أ.</b> 67%، طبقتان من ثلاث</li><li><b>ب.</b> 100%، لأن الطبقة الثالثة لها بند ولو جزئي</li><li><b>ج.</b> تُترك حتى يكتمل سجل التشغيل</li><li><b>د.</b> 0%، وطبقة التطبيق بلا بند كاف</li></ul></li>
<li><p>سكن الطلاب ادعى المستوى 3 في سؤال «إدارة بيانات الساكنين». الأدلة: وثيقة نهائية كافية للمستوى 1، واعتماد من الدور المحدد كاف للمستوى 2، وسجل تشغيل يغطي مبنيين من ستة للمستوى 3. ما المستوى المدعوم؟</p><ul><li><b>أ.</b> 3، لأن للمستوى الثالث بندًا في الملف</li><li><b>ب.</b> 2، والمستوى 3 ينقصه بقية المباني</li><li><b>ج.</b> 0، لأن في السلسلة بندًا جزئيًا</li><li><b>د.</b> 2.5، نصف المستوى الثالث</li></ul></li>
<li><p>مقياس في المكتبة: نسبة نجاح قواعد جودة بيانات الإعارة. في المستخرج 50 قاعدة مفعلة لها تشغيل داخل الفترة، نجح آخر تشغيل لـ 44 منها. وست قواعد أخرى لم تُشغَّل إلا بعد نهاية الفترة، ونجحت كلها. ما القيمة؟</p><ul><li><b>أ.</b> 89.3%: (44 + 6) ÷ 56</li><li><b>ب.</b> 78.6%: 44 ÷ 56</li><li><b>ج.</b> 88.0%: 44 ÷ 50</li><li><b>د.</b> لا يُحسب حتى تُشغَّل القواعد الست داخل الفترة</li></ul></li>
<li><p>بند في ملف المكتبة: «تقرير ربع سنوي عن الإعارة» للربع الثاني، أُعد بعد نهاية الفترة بثلاثة أسابيع، حين طلب مكتب الامتثال الأدلة، ولم يُعد تقرير قبله قط. بقواعد الكفاية المرتبة، ما الحكم؟</p><ul><li><b>أ.</b> غير كاف، لأنه أُعد بعد الفترة لملف التقييم</li><li><b>ب.</b> جزئي بالقاعدة R4، لأنه يغطي ربعًا واحدًا من الفترة</li><li><b>ج.</b> كاف، لأنه عن ربع داخل الفترة</li><li><b>د.</b> غير كاف، لأنه خارج فترة الأدلة</li></ul></li>
<li><p>لقطة شاشة من نظام سكن الطلاب يظهر فيها اسم النظام وعدد الغرف المحدثة، ولا يظهر أي تاريخ. ما الحكم عليها دليلًا على التطبيق؟</p><ul><li><b>أ.</b> كافية، لأن اسم النظام ظاهر</li><li><b>ب.</b> غير كافية، لأنها بلا تاريخ</li><li><b>ج.</b> جزئية، لأن أحد الشرطين متحقق</li><li><b>د.</b> كافية إذا أكد مدير النظام تاريخها</li></ul></li>
<li><p>مواصفة تطلب التدريب لكل الموظفين المعنيين في الجامعة. قدمت عمادة الدراسات العليا قوائم حضور لموظفيها وحدهم داخل الفترة، موقعة ومؤرخة. ما الحكم؟</p><ul><li><b>أ.</b> كاف، لأن القوائم موقعة ومؤرخة</li><li><b>ب.</b> غير كاف، لأنه لا يغطي الجامعة</li><li><b>ج.</b> كاف لعمادة الدراسات العليا ولا حكم لغيرها</li><li><b>د.</b> جزئي، لأنه يغطي جزءًا من النطاق</li></ul></li>
<li><p>حكم أخصائي على 40 بندًا، ووافق حكمه مفتاح المقيِّم في 33 منها. والهدف 85% على الأقل. ماذا يقول هذا؟</p><ul><li><b>أ.</b> بلغ الهدف، لأن 33 أكثر من ثلاثة أرباع البنود</li><li><b>ب.</b> بلغه؛ سبعة خلافات تُغتفر</li><li><b>ج.</b> لم يبلغه: 82.5%، والهدف 34 بندًا</li><li><b>د.</b> لا يُعرف قبل معرفة البنود التي خالف فيها</li></ul></li>
<li><p>سؤال نضج عن إدارة بيانات الإعارة في المكتبة: ادعى المالك المستوى 4. الأدلة كافية للمستويات 1 و3 و4، ولا دليل كافيًا للمستوى 2 (اعتماد الإجراء). ما المستوى المدعوم بأداة المقرر؟</p><ul><li><b>أ.</b> 4، لأن دليله كاف</li><li><b>ب.</b> 3، بعد خصم المستوى الناقص</li><li><b>ج.</b> 0، لأن في السلسلة فجوة</li><li><b>د.</b> 1، لأن المستوى 2 ناقص</li></ul></li>
<li><p>مالكة بيانات سكن الطلاب ادعت المستوى 2، وأدلتها كافية حتى المستوى 4. ماذا يُكتب في الاستبانة؟</p><ul><li><b>أ.</b> المستوى 2، لأن المالكة أعرف ببياناتها</li><li><b>ب.</b> المستوى 3، حلًا وسطًا بين ادعاء المالكة وأدلتها</li><li><b>ج.</b> المستوى 4، مع ملاحظة بأن الادعاء أقل من الأدلة</li><li><b>د.</b> يُترك السؤال حتى تعدّل المالكة ادعاءها</li></ul></li>
<li><p>مقياس «نسبة سجلات الساكنين المكتملة» في سكن الطلاب. المستخرج فيه 520 صفًا، منها 20 صفًا مكررًا لساكنين انتقلوا بين المباني، و40 لساكنين غادروا قبل الفترة. التعريف يحسب الساكنين الحاليين مرة واحدة. ما المقام؟</p><ul><li><b>أ.</b> 460، بعد حذف المكرر والمغادرين</li><li><b>ب.</b> 480، بعد حذف المغادرين وحدهم</li><li><b>ج.</b> 500، بعد حذف المكرر وحده</li><li><b>د.</b> 520، كل الصفوف</li></ul></li>
<li><p>أرسل المشرف الفني في المكتبة لوحة تعرض «نسبة نجاح القواعد 94%» دون المستخرج ودون طريقة الحساب. ما المشكلة في جعلها دليلًا على مقياس تشغيلي؟</p><ul><li><b>أ.</b> أن النسبة مرتفعة فتبدو غير واقعية</li><li><b>ب.</b> أن أحدًا لا يستطيع إعادة الحساب من المستخرج نفسه</li><li><b>ج.</b> أن اللوحات لا تُقبل دليلًا، ولو أُرفق بها المستخرج</li><li><b>د.</b> أن النسبة يجب أن تكون عددًا لا نسبة</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: المساعد والملاحظات ودورة التدقيق</h2>
<ol>
<li><p>لقطة شاشة من نظام سكن الطلاب، يظهر فيها اسم النظام وتاريخ داخل الفترة. التقطها مسؤول الامتثال بعد نهاية الفترة بشهر، وغيّر تاريخ الجهاز ليطابق موعد الربع الذي يصفه. قُدِّمت لطبقة التطبيق. ما الحكم؟</p><ul><li><b>أ.</b> كاف، لأن التاريخ واسم النظام ظاهران</li><li><b>ب.</b> غير كاف بالقاعدة R7: لقطة تاريخها لا يطابق وقت التقاطها</li><li><b>ج.</b> جزئي بالقاعدة R4: تغطي ربعًا واحدًا</li><li><b>د.</b> غير كاف بالقاعدة R5: أُعدت بعد الفترة لملف الامتثال</li></ul></li>
<li><p>جهزت عمادة الدراسات العليا أربع وثائق لتجربة الربط: سياسة البيانات البحثية المنشورة على الموقع («عام»)، ومحضر لجنة البيانات البحثية («مقيد»)، وصفحة الأسئلة الشائعة («عام»)، وتقرير تدقيق داخلي («سري»). ما يجوز إدخاله؟</p><ul><li><b>أ.</b> الوثائق الأربع بعد حذف الأسماء منها</li><li><b>ب.</b> السياسة المنشورة وصفحة الأسئلة الشائعة</li><li><b>ج.</b> الوثائق كلها ما عدا تقرير التدقيق الداخلي</li><li><b>د.</b> الأربع، إن كانت الأداة مستضافة في الجامعة</li></ul></li>
<li><p>في مكتبة الجامعة أنهى المساعد ربط دفعة من 25 وثيقة «عام». أي ممارسة تحقق بند التوقيع البشري في قاعدة الاستخدام؟</p><ul><li><b>أ.</b> يعتمد مشرف المكتبة الدفعة كلها بعد نظرة على خمسة روابط</li><li><b>ب.</b> يوقع المشرف التقني بأن المساعد عمل دون أعطال</li><li><b>ج.</b> يقرأ الأخصائي وثيقة كل ربط ومواصفته، ويسجل قراره</li><li><b>د.</b> توقيع الروابط منخفضة الثقة وحدها</li></ul></li>
<li><p>في سجل المكتبة ملاحظتان: H03 على مواصفة P1 في حالة واحدة، وH01 على مواصفة P3 في كل المكتبة. بقاعدة الترتيب، أيهما أولًا؟</p><ul><li><b>أ.</b> H01، لأن الفجوة تشمل المكتبة كلها</li><li><b>ب.</b> H01، فرقمها أصغر من H03</li><li><b>ج.</b> لا ترتيب بينهما، والمدقق يختار</li><li><b>د.</b> H03، فأولويتها أعلى عند التساوي</li></ul></li>
<li><p>إجراء تصحيحي في سكن الطلاب: «تشغيل قاعدة اكتمال رقم الغرفة أسبوعيًا في نظام السكن». أُعلن تنفيذه في الأسبوع 3. أي دليل يثبت إغلاق الإجراء نفسه في الأسبوع 12؟</p><ul><li><b>أ.</b> بريد من مدير النظام يؤكد أن القاعدة تعمل كل أسبوع منذ الأسبوع 3</li><li><b>ب.</b> سجل تشغيل بتواريخ أسبوعية من الأسبوع 3 إلى الأسبوع 11</li><li><b>ج.</b> الإجراء المعتمد الذي يطلب التشغيل الأسبوعي</li><li><b>د.</b> لقطة من لوحة النظام بلا تاريخ</li></ul></li>
<li><p>تريد عمادة الدراسات العليا أن يربط مساعد ذكاء اصطناعي وثائقها بالمواصفات. أي مجموعة يجوز إدخالها في المساعد بحسب مبادئ الذكاء الاصطناعي التوليدي للجهات الحكومية؟</p><ul><li><b>أ.</b> الوثائق المصنفة «عام» وحدها</li><li><b>ب.</b> كل وثائق العمادة، لأن المساعد معتمد من الجهة</li><li><b>ج.</b> الوثائق «عام» و«مقيد» بعد حذف الأسماء</li><li><b>د.</b> كل الوثائق إذا وقع موظف على كل ربط</li></ul></li>
<li><p>في تجربة للمكتبة ربط مساعد 30 وثيقة، وأخطأ في 6، منها 4 قال عنها «ثقة عالية». ماذا تستنتج عن عمود الثقة؟</p><ul><li><b>أ.</b> أنه يصلح لتخطي المراجعة البشرية في الروابط عالية الثقة</li><li><b>ب.</b> أنه لا يُحكم عليه قبل ألف وثيقة</li><li><b>ج.</b> أنه يقيس الصحة بدقة لأن الخطأ 20% فقط</li><li><b>د.</b> أنه لا يغني عن المراجعة: أكثر الأخطاء جاءت بثقة عالية</li></ul></li>
<li><p>نتائج مساعد في سكن الطلاب على 25 وثيقة من كل نوع: اللوائح 6 أخطاء، والتقارير الدورية خطأ واحد، وصفحات الموقع 5 أخطاء. أي قاعدة استخدام تسندها هذه الأرقام؟</p><ul><li><b>أ.</b> ربط أولي للأنواع الثلاثة يوقعه إنسان، لأن الخطأ الكلي 12 من 75</li><li><b>ب.</b> ربط أولي للتقارير يوقعه إنسان، واللوائح والصفحات يربطها إنسان</li><li><b>ج.</b> منع المساعد كليًا ما دام قد أخطأ في الأنواع كلها</li><li><b>د.</b> ربط آلي للتقارير دون مراجعة، لأن خطأها 4%</li></ul></li>
<li><p>قاعدة المكتبة: تُراجع عينة من 15 ربطًا كل دورة، ويتوقف الربط الأولي إذا وُجد خطآن أو أكثر. لماذا تُكتب هذه القاعدة قبل التجربة لا بعدها؟</p><ul><li><b>أ.</b> كي يتحسن المساعد حين يعرف القاعدة</li><li><b>ب.</b> لأن العينة الأصغر من 15 لا تُحسب</li><li><b>ج.</b> حتى لا يُختار حد التوقف بعد رؤية النتيجة</li><li><b>د.</b> لأن المكتب الوطني يطلب عينة من 15 ربطًا تحديدًا</li></ul></li>
<li><p>ملاحظة مكتوبة في سجل المكتبة: «قاعدة بيانات الإعارة سيئة الجودة». ما الجزء الذي ينقصها أولًا لتصير ملاحظة قابلة للتدقيق؟</p><ul><li><b>أ.</b> المالك: من يعالجها</li><li><b>ب.</b> الأثر: ما يحدث لو لم تُعالج</li><li><b>ج.</b> الحالة: ما وُجد بعدد ومكان ودليل</li><li><b>د.</b> الأولوية: P1 أو P2 أو P3</li></ul></li>
<li><p>في المكتبة مشاهدتان: سجلات إعارة محفوظة بعد مدة الاحتفاظ في نظام الإعارة، ونسخ ممسوحة محفوظة بعد مدتها في الأرشيف الرقمي. السبب في الحالتين أن جدول مدد الاحتفاظ لم يُعتمد قط. كيف تُسجلان؟</p><ul><li><b>أ.</b> ملاحظة واحدة سببها جدول غير معتمد، تذكر المشاهدتين</li><li><b>ب.</b> ملاحظتان منفصلتان، لأن كل مشاهدة في نظام مختلف</li><li><b>ج.</b> لا تُسجلان، لأن حذف السجلات القديمة عمل يجري لاحقًا</li><li><b>د.</b> ملاحظة عن مشرفَي النظامين بالاسم</li></ul></li>
<li><p>إجراء مشاركة البيانات في عمادة الدراسات العليا ما زال مسودة. بقي على التقديم عشرة أسابيع، ولجنة إدارة البيانات تجتمع بعد أربعة أسابيع، وآخر موعد للأدلة قبل التقديم بأسبوعين. ما الإجراء السليم؟</p><ul><li><b>أ.</b> تسجيل عدم الامتثال في هذه الدورة وتأجيل الاعتماد إلى الدورة القادمة</li><li><b>ب.</b> اعتماد الإجراء في اجتماع اللجنة القادم، ثم إدخاله الملف بعد التحقق</li><li><b>ج.</b> إدخال المسودة الملف مع بريد يقول إنها ستُعتمد</li><li><b>د.</b> اعتماد الإجراء بعد التقديم وإرسال نسخته لاحقًا</li></ul></li>
<li><p>إجراء تصحيحي في المكتبة: «تشغيل قواعد جودة بيانات الإعارة أسبوعيًا»، مالكه أمين البيانات التقني في المكتبة. من يتحقق من إغلاقه؟</p><ul><li><b>أ.</b> أمين البيانات التقني نفسه، لأنه من يشغّل القواعد</li><li><b>ب.</b> لا يحتاج متحققًا، لأن سجل التشغيل يكفي</li><li><b>ج.</b> مكتب إدارة البيانات كله</li><li><b>د.</b> مسؤول الامتثال، لأنه ليس مالك الإجراء</li></ul></li>
